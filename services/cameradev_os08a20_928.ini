; ============= VideoMode Specified Configure =============
[common]
mediamode          = "HI_PARAM_MEDIAMODE_1080P_30"
sensorcnt          = "1"
[common.vcap0.pipe.0]
vcappipe_hdl       = "0"
vivpssmode         = "0"; 0:vi offline,vpss offline, 1:vi offline,vpss online,2:vi online,vpss offline,3:vi online,vpss online,4:vi parallel,vpss offline,5:vi parallel,vpss parallel,6:butt
[common.vcap0.pipe.1]
vcappipe_hdl       = "0"
vivpssmode         = "0"; 0:vi offline,vpss offline, 1:vi offline,vpss online,2:vi online,vpss offline,3:vi online,vpss online,4:vi parallel,vpss offline,5:vi parallel,vpss parallel,6:butt

; ============= VB Configure =============
[vb]
max_poolcnt        = 2
[vb.pool.0]
image_width        = "3840"
image_height       = "2180"
pix_format         = "21"
data_bitwidth      = "0"
compress_mode      = "1"
default_align      = "8"
blk_count          = "15"
[vb.pool.1]
image_width        = "3840"
image_height       = "2180"
pix_format         = "28"
data_bitwidth      = "0"
compress_mode      = "1"
default_align      = "8"
blk_count          = "15"
; ============= Vcapture 0 Configure =============

[vcap0.dev]
sensor_type        = "5"; 0 WIDE_ANGLE  1 FISH_EYE 2 TRUE_DEAPTH
sensor_lib         = "/usr/lib/libsns_os08a20.so"
sensor_obj         = "g_sns_os08a20_obj"
sensor_width       = "3840";stSize.u32Width
sensor_height      = "2180";stSize.u32Width
pipecnt            = "1"

[vcap0.mipi]
enable             = "1";
combo_dev_t        = "0";combo_dev_t
input_mode_t       = "0";0:INPUT_MODE_MIPI
mipi_data_rate_t   = "0";0:MIPI_DATA_RATE_X1
img_rect_x         = "0"
img_rect_y         = "0"
img_rect_w         = "3840"
img_rect_h         = "2180"
data_type_t        = "2"    ;2:DATA_TYPE_RAW_12BIT
mipi_wdr_mode_t    = "0"
lane_id_num        = "8"
lane_id_0          = "0"
lane_id_1          = "1"
lane_id_2          = "2"
lane_id_3          = "3"
lane_id_4          = "-1"
lane_id_5          = "-1"
lane_id_6          = "-1"
lane_id_7          = "-1"

[vcap0.isp_pub]
enable             = "1";
stWndRect_x        = "0";
stWndRect_y        = "0";
stWndRect_w        = "3840";
stWndRect_h        = "2180";
outImageSize_x     = "3840";
outImageSize_y     = "2180";
frameRate          = "30"
bayer_format       = "3";OT_ISP_BAYER_BGGR
wdrMode            = "0";WDR_MODE_NONE
snsMode            = "0"
busId              = "2";

[vcap0.pipe.0]
chncnt             = "1"
pipe_bypass_mode   = "0";
isp_bypass         = "0";
width              = "3840";
height             = "2180";
pixel_format       = "21";
compress_mode      = "4";
src_framerate      = "30";FRAME_RATE_CTRL_S
dst_framerate      = "30";FRAME_RATE_CTRL_S
interrupt_type     = "2"; 0 is start, 1 is early, 2 is early_end
earlyline          = "100";

[vcap0.pipe.0.chl.0]
out_width          = "3840"
out_height         = "2180"
pixel_format       = "28";
dynamic_range      = "0";
video_format       = "0";
compress_mode      = "0";
mirror_en          = "0"
flip_en            = "0"
depth              = "0"
src_framerate      = "30";FRAME_RATE_CTRL_S
dst_framerate      = "30";FRAME_RATE_CTRL_S
